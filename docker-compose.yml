name: pdf-extractor-tp1

x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  extractor:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf-extractor:latest
    env_file:
      - path: .env
        required: false
    environment:
      <<: *common-env
      EXTRACT_TIMEOUT_SECONDS: ${EXTRACT_TIMEOUT_SECONDS:-60}
      ADMISSION_TIMEOUT_SECONDS: ${ADMISSION_TIMEOUT_SECONDS:-60.0}
      QUEUE_MAX_SIZE: ${QUEUE_MAX_SIZE:-256}
      HTTP_LIMIT_CONCURRENCY: ${HTTP_LIMIT_CONCURRENCY:-64}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      EXTRACTION_POOL_SIZE: ${EXTRACTION_POOL_SIZE:-4}
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: "3.0"
          memory: 768M
        reservations:
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - pdf-extractext-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=pdf-extractext-network"
      
      - "traefik.http.routers.extractor.rule=Host(`extractor.localhost`) || Host(`localhost`) || Host(`127.0.0.1`)"
      - "traefik.http.routers.extractor.entrypoints=web"
      - "traefik.http.services.extractor.loadbalancer.server.port=8000"

      - "traefik.http.routers.extractor.middlewares=extractor-retry@docker, extractor-cb@docker"

      - "traefik.http.middlewares.extractor-retry.retry.attempts=3"
      - "traefik.http.middlewares.extractor-retry.retry.initialinterval=100ms"

      - "traefik.http.middlewares.extractor-cb.circuitbreaker.expression=NetworkErrorRatio() > 0.2 || ResponseCodeRatio(500, 600, 0, 600) > 0.2"
      - "traefik.http.middlewares.extractor-cb.circuitbreaker.checkperiod=10s"
      - "traefik.http.middlewares.extractor-cb.circuitbreaker.fallbackduration=15s"

networks:
  pdf-extractext-network:
    external: true
    external: true
