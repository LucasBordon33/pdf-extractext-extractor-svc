
services:
  extractor:
    build:
      context: .
    image: pdf-extractext-service:0.1.0
    env_file:
      - path: .env
        required: false
    expose:
      - "${PORT:-8000}"
    read_only: true
    tmpfs:
      - /tmp:size=10m
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MEM_LIMIT:-512m}
    restart: unless-stopped
    networks:
      - pdf-extractext-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.extractor.rule=Host(`${EXTRACTOR_HOST:-universidad.localhost}`) && PathPrefix(`/extract`)"
      - "traefik.http.routers.extractor.entrypoints=websecure"
      - "traefik.http.routers.extractor.tls=true"
      - "traefik.http.routers.extractor.priority=100"
      - "traefik.http.services.extractor.loadbalancer.server.port=${PORT:-8000}"

networks:
  traefik-net:
    external: true
  pdf-extractext-network:
    external: true
