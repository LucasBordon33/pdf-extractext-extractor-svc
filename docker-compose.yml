services:
  extractor:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      HOST: ${HOST:-0.0.0.0}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-12}
      EXTRACT_TIMEOUT_SECONDS: ${EXTRACT_TIMEOUT_SECONDS:-25.0}
      ADMISSION_TIMEOUT_SECONDS: ${ADMISSION_TIMEOUT_SECONDS:-10.0}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      EXTRACTION_POOL_SIZE: ${EXTRACTION_POOL_SIZE:-2}
      MAX_CONCURRENT_EXTRACTIONS: ${MAX_CONCURRENT_EXTRACTIONS:-4}
      QUEUE_MAX_SIZE: ${QUEUE_MAX_SIZE:-64}
      ALLOWED_MIME_TYPES: ${ALLOWED_MIME_TYPES:-application/pdf}
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
