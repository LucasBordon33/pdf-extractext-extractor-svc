[project]
name = "pdf-extractext-extractor-svc"
version = "0.1.0"
description = "Microservicio para extracción de contenido de archivos PDF"
requires-python = ">=3.11"
dependencies = [
    # fastapi/uvicorn: capa HTTP (ASGI)
    "fastapi",
    "uvicorn[standard]",
    # pydantic: validación en la frontera
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    # pypdfium2: motor de extracción (ADR-TP-1, reemplaza a PyPDF2)
    "pypdfium2>=5.13.0",
    # python-multipart: parseo de multipart/form-data (R2, upload)
    "python-multipart>=0.0.32",
    # orjson: serialización rápida para respuestas grandes
    "orjson>=3.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",     # gate de cobertura >= 90% en core/domain/adapters
    "httpx",          # TestClient
    "ruff",
    "mypy",
    # PyPDF2 ya no es runtime: queda solo como generador de PDFs
    # de prueba (pypdfium2 no escribe PDFs; ver tests/fixtures/)
    "pypdf2>=3.0.1",
]

# Sin dependencias Python: k6/Vegeta corren fuera del contenedor.
# El grupo existe para documentar el entorno de stress testing.
stress = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # errores de estilo (pycodestyle)
    "F",  # pyflakes
    "I",  # orden de imports
    "UP", # modernización de sintaxis
    "B",  # bugbear: errores comunes probables
]
ignore = []

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa el patrón `Depends(...)` como default argument (B008).
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# El gate de calidad mide solo el código de negocio: la capa HTTP
# (api/) y el entrypoint (main.py) se validan por los tests de
# integración/contrato, no por porcentaje.
source = ["core", "domain", "adapters"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
packages = ["main", "api", "core", "domain", "adapters"]
# gradual: errores reales sin exigir anotar cada función de una vez.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
