[project]
name = "pdf-extractext-extractor-svc"
version = "0.1.0"
description = "Microservicio para extracción de contenido de archivos PDF"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "PyPDF2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # errores de estilo (pycodestyle)
    "F",  # pyflakes
    "I",  # orden de imports
    "UP", # modernización de sintaxis
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
